<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
<title>Kuafix</title>
<style>
:root{--accent:#0a84ff;--accent-soft:rgba(10,132,255,.14);--g1:#c3dcff;--g2:#cbf1dc;--bar-bg:rgba(246,247,249,.82);}

*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f6f7f9; --bg2:#ffffff;
  --surface:rgba(255,255,255,.72); --surface-solid:#ffffff;
  --text:#0b0b0f; --muted:#6b6f76; --line:rgba(0,0,0,.08);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 30px 60px rgba(0,0,0,.14);
  --radius:22px; --frame:#d7dade; --frame-in:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#08090c; --bg2:#0e1014;
    --surface:rgba(28,30,36,.72); --surface-solid:#16181d;
    --text:#f4f5f7; --muted:#9aa0a8; --line:rgba(255,255,255,.10);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.55);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 34px 70px rgba(0,0,0,.6);
    --frame:#2a2d33; --frame-in:#0b0c0f;
  }
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.6; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.glow::before{width:70vw;height:70vw;max-width:760px;max-height:760px;top:-24vw;right:-18vw;background:var(--g1)}
.glow::after{width:62vw;height:62vw;max-width:680px;max-height:680px;bottom:-22vw;left:-20vw;background:var(--g2)}
@media (prefers-color-scheme:dark){.glow::before,.glow::after{opacity:.30}}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}

/* hero */
.hero{padding:56px 0 8px;text-align:center}
.app-icon{width:108px;height:108px;margin:0 auto;border-radius:26px;object-fit:cover;
  box-shadow:var(--shadow-lg)}
.wordmark{width:min(300px,76vw);margin:0 auto}
@media (prefers-color-scheme:dark){.wordmark{filter:invert(1) brightness(1.06)}}
.hero h1{font-size:clamp(34px,9vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:18px 0 0}
.stores{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:26px 0 0}
.stores a{display:block;transition:transform .18s ease,filter .18s ease}
.stores a:hover{transform:translateY(-2px)}
.stores img{height:46px;width:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
@media (prefers-color-scheme:dark){
  .stores img{filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(255,255,255,.75)) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
}

/* screenshots */
.shots{margin:40px -16px 0;padding:6px 16px 18px;display:flex;gap:16px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot{margin:0;flex:0 0 auto;width:min(172px,46vw);scroll-snap-align:center;
  background:var(--frame-in);border:5px solid var(--frame);border-radius:26px;
  overflow:hidden;box-shadow:var(--shadow-lg);transition:transform .25s ease}
.shot:hover{transform:translateY(-6px)}
.shot img{width:100%;height:auto}
@media (min-width:760px){
  .shots{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:52px auto 0;gap:20px;
    max-width:600px;padding-bottom:0}
  .shot{width:auto}
  .shot:nth-child(2){transform:translateY(-14px)}
  .shot:nth-child(2):hover{transform:translateY(-22px)}
}

/* doc cards */
.docs{display:grid;gap:12px;margin:44px auto 0;max-width:640px}
@media (min-width:640px){.docs{grid-template-columns:repeat(2,1fr)}}
.doc-card{display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  color:var(--text);font-weight:600;font-size:16px;
  transition:transform .18s ease,box-shadow .18s ease}
.doc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);text-decoration:none}
.doc-card .ico{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;
  border-radius:11px;background:var(--accent-soft);color:var(--accent)}
.doc-card .ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.doc-card .chev{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}

/* footer */
.foot{margin:56px 0 40px;text-align:center;color:var(--muted);font-size:13.5px}

/* document pages */
.topbar{position:sticky;top:0;z-index:5;background:var(--bar-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;color:var(--accent)}
.back:hover{text-decoration:none;opacity:.75}
.back .mark{width:26px;height:26px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.doc{max-width:760px;margin:0 auto;padding:0 16px}
.doc .content{background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(22px,5vw,46px);margin:28px 0 0}
.doc h1{font-size:clamp(26px,6vw,36px);line-height:1.15;letter-spacing:-.025em;font-weight:800;margin:0 0 6px}
.doc h2{font-size:clamp(18px,3.6vw,21px);font-weight:700;letter-spacing:-.015em;margin:34px 0 8px;
  padding-top:18px;border-top:1px solid var(--line)}
.doc h3{font-size:16.5px;font-weight:650;margin:22px 0 6px;color:var(--text)}
.doc p{margin:10px 0;color:var(--muted);font-size:16px}
.doc strong{color:var(--text);font-weight:650}
.doc ul,.doc ol{margin:10px 0;padding-left:20px;color:var(--muted);font-size:16px}
.doc li{margin:7px 0}
.doc li::marker{color:var(--accent)}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc hr + h2{border-top:0;padding-top:0;margin-top:22px}
.doc .content > h2:first-of-type{}
.doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:10px 12px;text-align:left;color:var(--muted)}
.doc th{background:var(--accent-soft);color:var(--text);font-weight:650}
.doc a{font-weight:600;word-break:break-word}
@media (prefers-color-scheme:dark){:root{--bar-bg:rgba(8,9,12,.82)}}</style>
</head>
<body>
  <div class="glow"></div>
  <main class="wrap">

    <header class="hero">
      <img class="wordmark" src="kfx_header.png" alt="Kuafix" />
      
      <div class="stores">
      <a href="https://apps.apple.com/tr/app/kuafix/id6746421487?l=tr" target="_blank" rel="noopener noreferrer" aria-label="App Store'dan indir" title="App Store'dan indir"><img src="app_store_badge_v2.png" alt="App Store'dan indir" /></a>
      <a href="https://play.google.com/store/apps/details?id=com.anbertech.kuafix" target="_blank" rel="noopener noreferrer" aria-label="Google Play'den indir" title="Google Play'den indir"><img src="google_play_badge_v2.png" alt="Google Play'den indir" /></a>
      </div>
    </header>

    <section class="shots" aria-label="Ekran görüntüleri">
      <figure class="shot"><img src="kfx_ss_isi_haritasi.png" alt="Yoğunluk ısı haritası ekranı" loading="lazy" /></figure>
      <figure class="shot"><img src="kfx_ss_finans.png" alt="Günlük finans özeti ekranı" loading="lazy" /></figure>
      <figure class="shot"><img src="kfx_ss_istatistik.png" alt="Müşteri istatistikleri ekranı" loading="lazy" /></figure>
    </section>

    <nav class="docs" aria-label="Belgeler">
      <a class="doc-card" href="privacy.html"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9.5 12.2l1.8 1.8 3.4-3.6"/></svg></span><span>Gizlilik Politikası</span><span class="chev">&rsaquo;</span></a>
      <a class="doc-card" href="delete.html"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6.5 7l.8 13h9.4l.8-13"/><path d="M10.5 11v6M13.5 11v6"/></svg></span><span>Hesap Silme</span><span class="chev">&rsaquo;</span></a>
      <a class="doc-card" href="terms.html"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span><span>Kullanım Koşulları (EULA)</span><span class="chev">&rsaquo;</span></a>
      <a class="doc-card" href="support.html"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3V5z"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.5.8c0 1.9-2.7 2-2.7 3.4"/><path d="M12 16.1h.01"/></svg></span><span>Destek</span><span class="chev">&rsaquo;</span></a>
    </nav>

    <footer class="foot">&copy; 2025 Kuafix &ndash; AnberTech</footer>
  </main>
</body>
</html>
