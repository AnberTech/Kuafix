<!doctype html><meta charset="utf-8">
<!-- Paylaşım görseli (assets/img/og.jpg, 1200x630). Üretim: Chrome ile 1200x630 ekran görüntüsü, sonra JPEG. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#06070A;font-family:Figtree,sans-serif;color:#F2F4F8}
.bg{position:absolute;inset:0;background:url(../assets/img/kfx_neon_bg.jpg) 0 0/620px auto repeat;opacity:.3}

.pole{position:absolute;top:70px;bottom:70px;width:20px;border-radius:5px;background:repeating-linear-gradient(-45deg,#0A84FF 0 12px,#F4F7FB 12px 24px,#30D158 24px 36px,#F4F7FB 36px 48px);box-shadow:0 0 24px rgba(10,132,255,.6),0 0 50px rgba(48,209,88,.35)}
.copy{position:absolute;left:96px;top:120px;width:560px}
.copy img{width:330px}

p{margin:18px 0 0;font:500 24px/1.4 Figtree;color:#B8C1CE}
.ph{position:absolute;top:60px;width:230px;border-radius:30px;overflow:hidden;border:5px solid #1C2029;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.ph img{width:100%;display:block}

<div class="bg"></div><div class="sh"></div>

<div class="ph" style="left:700px;transform:rotate(-5deg);top:90px"><img src="../assets/img/kfx_ss_randevu.png"></div>
